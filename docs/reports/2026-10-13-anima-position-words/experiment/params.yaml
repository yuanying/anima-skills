# 全条件共通の生成パラメータ（sdctl --params）。
# width / height / seed はシーンごとに generate.py がフラグで渡す。
negative_prompt: "worst quality, low quality, score_1, score_2, score_3, artist name, blurry, jpeg artifacts, chromatic aberration, duplicate, twins, clone, nsfw, nude, nipples, penis, bulge"
steps: 30
cfg_scale: 4.5
sampler: "ER SDE"
scheduler: "simple"
batch_count: 1
batch_size: 1
override_settings:
  sd_model_checkpoint: "anima_anima-base-v1.0"
  forge_additional_modules:
    - "qwen_image_vae.safetensors"
    - "qwen_3_06b_base.safetensors"
