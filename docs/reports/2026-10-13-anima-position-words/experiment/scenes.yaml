# 構図シーン定義。4 つの書き方（build_prompts.py の METHODS）は、この同じ要素からプロンプトを組み立てる。
#
# - group:        action（動作・相互作用が主役）/ camera（カメラが自由なほうが自然）/ position（位置を守る必要がある）
# - scene_nl:     全体シーン文。位置語も人物名も含めない（pos-words / no-pos / relational で共通）
# - scene_pos_nl: scene-pos 用の全体シーン文。人物名と位置をこの 1 文にだけ書く
# - relation_nl:  relational 用の関係文。絶対位置（左・右・中央）を使わず、人物どうしの相対関係を名前で書く
# - chars:        キャラごとの位置語（pos）、位置付きの呼び名（label）、動作（pose_nl）
#                 pose_nl の {natsumi} などは相手の呼び方。pos-words では相手の label、それ以外では相手のトリガーワードに置き換える
# - belongings_nl: 持ち物の言い直し（任意）。{natsumi} などの置き換えは pose_nl と同じ
# - scene_tags / camera_tags / env_tags: 1 行目のタグ（全書き方で共通）
# - criteria:     評価で確認する「意図」（評価者に渡す）。position グループだけ左右・中央の正しさを判定する
#
# 服装は characters.yaml の固定値を全シーンで使う。

# ---- action: 動作・相互作用が主役 ----
- id: a01
  title: 本を手渡す
  group: action
  width: 1344
  height: 768
  count: 2girls
  scene_nl: Two friends are in a classroom after school, and one of them hands a book to the other.
  scene_pos_nl: In a classroom after school, kutara natsumi on the left hands a book to kutara sayaka on the right.
  scene_tags: giving, holding book, facing another
  relation_nl: kutara natsumi and kutara sayaka face each other, and the book passes from the hands of kutara natsumi into the hands of kutara sayaka.
  chars:
    - who: natsumi
      pos: On the left
      label: the girl on the left
      pose_nl: holds out a red book with both hands, offering it to {sayaka}
    - who: sayaka
      pos: On the right
      label: the girl on the right
      pose_nl: reaches out with both hands to take the book from {natsumi} and smiles
  camera_tags: cowboy shot, from side
  env_tags: indoors, classroom, desks, window, afternoon sunlight
  criteria: 2人。なつみ（眼鏡・黒髪ポニーテール・緑セーター）が赤い本を差し出し、さやか（金髪ロング・赤パーカー）がそれを受け取ろうと手を伸ばしている。本は1冊で二人の手の間にある。二人は向き合う。差し出す側と受け取る側が逆なら動作は 0。

