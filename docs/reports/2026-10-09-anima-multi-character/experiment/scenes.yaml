# 構図シーン定義。各指示方法（methods）はこの同じ要素からプロンプトを組み立てる。
#
# - scene_nl:   全体シーンを述べる 1 文
# - scene_tags: シーン全体のタグ（行為・関係）
# - relation_nl: 相互作用・関係を言い直す 1 文（interaction-relations 用）
# - chars:      キャラごとの位置・ポーズ。pos は位置語ブロックの見出し、label は位置付きの呼び名、
#               pose_tags / pose_nl はそのキャラ自身の動作
# - camera_tags / env_tags: カメラ・構図、背景・光
# - criteria:   評価で確認する「意図」（評価者に渡す）
#
# 服装は characters.yaml の固定値を全シーンで使う。
- id: s01
  title: 2人並び（基準）
  difficulty: easy
  width: 1344
  height: 768
  count: 2girls
  scene_nl: Two girls are standing side by side in a park, facing the viewer.
  scene_tags: side-by-side, waving
  relation_nl: The girl on the left waves while the girl on the right keeps her hands on her hips.
  chars:
    - who: natsumi
      label: the girl on the left
      pos: On the left
      pose_tags: waving, raised right hand, smile
      pose_nl: waves at the viewer with her right hand raised and smiles
    - who: sayaka
      label: the girl on the right
      pos: On the right
      pose_tags: hands on own hips, closed mouth
      pose_nl: stands with both hands on her hips and a calm expression
  camera_tags: cowboy shot, straight-on, looking at viewer
  env_tags: outdoors, park, trees, daytime, sunlight
  criteria: 2人。左=なつみ（眼鏡・黒髪ポニーテール・緑セーター）が右手を挙げて手を振る。右=さやか（金髪ロング・赤パーカー）が両手を腰に当てる。

